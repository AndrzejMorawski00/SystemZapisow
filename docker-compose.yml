services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile.backend
    container_name: systemzapisow-backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file: .env
    volumes:
      - ./backend/:/app/
  frontend:
    container_name: systemzapisow-frontend
    env_file: .env
    build:
      context: ./frontend/
      dockerfile: Dockerfile.frontend
      target: prod
      args:
        - VITE_API_BASE_URL_PROD=$VITE_API_BASE_URL_PROD
        - VITE_API_BASE_URL_LOCAL=$VITE_API_BASE_URL_LOCAL
    stdin_open: true
    ports:
      - "80:80"

volumes:
  postgres_data:
    name: backend_postgres_data
    external: true